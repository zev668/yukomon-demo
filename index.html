<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f1eee6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Yukomon · 淡水鱼采集图鉴 Demo</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/publish.css" />
</head>
<body>
  <div id="stage">
    <aside id="side-info">
      <h1>Yukomon</h1>
      <p class="sub">淡水鱼采集图鉴 · 可交互原型</p>
      <dl>
        <dt>记录渔获</dt>
        <dd>拍照、自己选鱼种、写一句描述，登记后直接入册并解锁鱼卡。</dd>
        <dt>看鱼卡</dt>
        <dd>电脑上移动鼠标，手机上晃动机身，卡片会有多层视差。点击可翻面。</dd>
        <dt>看别人的图鉴</dt>
        <dd>排行榜里点任意一位钓手，进入他的图鉴页，可以给他的渔获点赞。</dd>
        <dt>分享链接</dt>
        <dd>鱼卡详情里点"分享链接"。打开后是一张视差鱼卡，背面是渔获照片、地点、时间和描述。</dd>
        <dt>巨物卡</dt>
        <dd>现场拍摄且尺寸达到这种鱼的巨物线，收入囊中后直接解锁 UR 巨物卡。</dd>
      </dl>
      <p class="foot">鱼体为程序生成的占位图，正式版替换为写实插画。数据只保存在本机浏览器。</p>
    </aside>
    <div id="phone">
      <div id="app">
        <main id="view"></main>
        <nav id="tabbar" aria-label="主导航">
          <button data-tab="catch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>
            <span>发布</span>
          </button>
          <button data-tab="rank">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
            <span>排行榜</span>
          </button>
          <button data-tab="dex">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
            <span>图鉴</span>
          </button>
        </nav>
        <div id="layers"></div>
        <div id="toast" role="status"></div>
        <div id="haptic-dot" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/card.js"></script>
  <script src="js/store.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
  <script src="js/elastic.js"></script>
</body>
</html>
