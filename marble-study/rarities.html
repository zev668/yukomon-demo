<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marble · Rarity Colors</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eeeef0;color:#202124;font-family:Arial,'Microsoft YaHei',sans-serif;letter-spacing:0}main{max-width:1680px;margin:auto;padding:36px 28px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:22px;font-weight:600;margin:0}button{width:36px;height:36px;border:1px solid #b5b6ba;border-radius:4px;background:#fff;font-size:20px;color:#262729;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #333;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}figure{margin:0;min-width:0}iframe{display:block;width:100%;aspect-ratio:5/7;border:0;border-radius:6px;background:#222}figcaption{padding:15px 0 0}a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;gap:8px}b{font-size:22px;font-weight:600}small{font-size:12px;color:#61636a}.swatches{display:flex;align-items:center;gap:7px;margin-top:12px}.swatch{width:14px;height:14px;border-radius:50%;border:1px solid #0002}.hex{font-family:Consolas,monospace;font-size:11px;color:#6b6d72;margin-right:5px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:22px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}h1{font-size:18px}.hex{font-size:9px}.swatches{flex-wrap:wrap;gap:4px}b{font-size:20px}}
</style></head>
<body><main><header><h1>稀有度配色</h1><button id="play" aria-label="暂停动画" title="暂停动画" aria-pressed="true">Ⅱ</button></header><section class="grid" aria-label="五种稀有度"></section></main>
<script>
const variants=[['N','灰白','#25292c','#b8bec2'],['R','蓝银','#082e50','#b5e5ff'],['SR','翡翠','#063e32','#8af0bd'],['SSR','金黑','#231d0b','#f7d477'],['UR','赤金','#630d26','#ffe3a3']];
for(const [rarity,name,background,paper] of variants){const figure=document.createElement('figure');figure.innerHTML=`<iframe title="${rarity} ${name}动态纹理" src="./?embed=1&rarity=${rarity}"></iframe><figcaption><a href="./?rarity=${rarity}" target="_blank" rel="noopener"><b>${rarity}</b><small>${name} ↗</small></a><div class="swatches"><span class="swatch" style="background:${background}"></span><span class="hex">${background}</span><span class="swatch" style="background:${paper}"></span><span class="hex">${paper}</span></div></figcaption>`;document.querySelector('.grid').append(figure);}
let playing=true;document.querySelector('#play').onclick=()=>{playing=!playing;const button=document.querySelector('#play');button.textContent=playing?'Ⅱ':'▷';button.title=button.ariaLabel=playing?'暂停动画':'播放动画';button.setAttribute('aria-pressed',String(playing));document.querySelectorAll('iframe').forEach(frame=>frame.contentWindow.postMessage({type:'marble-play',playing},location.origin));};
</script></body></html>
