<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Study · Motion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#141618}body{display:grid;place-items:center}canvas{display:block;width:min(100%,839px);height:auto;aspect-ratio:839/1675}button{position:fixed;right:18px;top:18px;width:38px;height:38px;background:#222;color:#eee;border:1px solid #666;border-radius:4px;cursor:pointer;font-size:20px}button:focus-visible{outline:2px solid white;outline-offset:3px}
</style>
<style>canvas{aspect-ratio:5/7}</style>
<style>
:root{font-family:Arial,'Microsoft YaHei',sans-serif;color:#eee;letter-spacing:0}.toolbar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:3}.toolbar button{position:static;font-size:20px}.panel{position:fixed;right:14px;top:62px;z-index:2;width:286px;max-height:calc(100dvh - 78px);overflow:auto;padding:18px;background:#202224f5;border:1px solid #54585b;border-radius:6px;scrollbar-width:thin}.panel[hidden]{display:none}.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel h1{margin:0;font-size:16px}.panel button{position:static;width:auto;height:30px;font-size:12px;padding:0 10px}.field{display:block;margin:0 0 15px;font-size:12px}.field span{display:flex;justify-content:space-between;margin-bottom:8px;gap:12px}.field output{color:#bbb;font-variant-numeric:tabular-nums}.field input[type=range]{display:block;width:100%;margin:0;accent-color:#ddd;cursor:pointer}.colors{display:flex;gap:16px;border-top:1px solid #484b4e;padding-top:16px}.colors label{flex:1;font-size:12px}.colors input{display:block;width:100%;height:30px;margin-top:8px;background:none;border:0;padding:0;cursor:pointer}input:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-width:600px){.panel{width:248px;max-height:55dvh;padding:14px}}
</style>
</head>
<body>
<canvas width="1000" height="1400" aria-label="代码生成的静态大理石流纹"></canvas>
<div class="toolbar"><button id="download" title="下载 PNG" aria-label="下载 PNG">↓</button><button id="toggle" title="收起参数" aria-label="收起参数" aria-expanded="true" aria-controls="panel">×</button></div>
<aside id="panel" class="panel" aria-label="流纹参数"><header><h1>静态流纹参数</h1><button id="reset">重置</button></header><div id="fields"></div><div class="colors"><label>背景色<input id="background" aria-label="背景色" type="color"></label><label>纹理色<input id="paper" aria-label="纹理色" type="color"></label></div></aside>
<script>
const canvas=document.querySelector('canvas');
const query=new URLSearchParams(location.search);
const rarityPalettes={N:['#25292c','#b8bec2'],R:['#082e50','#b5e5ff'],SR:['#063e32','#8af0bd'],SSR:['#231d0b','#f7d477'],UR:['#630d26','#ffe3a3']};
let rarity=query.get('rarity');
if(!rarityPalettes[rarity])rarity=null;
if(query.has('embed')){canvas.width=500;canvas.height=700;document.querySelector('.toolbar').hidden=true;document.querySelector('#panel').hidden=true;document.head.insertAdjacentHTML('beforeend','<style>.toolbar{display:none}html,body{background:transparent}canvas{width:100%}</style>');}
const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const vertex=`attribute vec2 position;void main(){gl_Position=vec4(position,0.,1.);}`;
const fragment=`precision highp float;
uniform vec2 resolution;
uniform float density, thickness, fineWidth, twist, radiusScale, distortion, bend, grainStrength, seed, zoom, direction;
uniform vec3 background, paper;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float sum=0.,a=.5;for(int i=0;i<5;i++){sum+=a*noise(p);p=mat2(1.6,-1.2,1.2,1.6)*p+3.17;a*=.5;}return sum;}
vec2 swirl(vec2 p,vec2 center,float radius,float twist){vec2 d=p-center;float r=length(d);float a=twist*exp(-r*r/(radius*radius));float c=cos(a),s=sin(a);return center+mat2(c,-s,s,c)*d;}
void main(){
  vec2 uv=gl_FragCoord.xy/resolution;
  vec2 p=vec2(uv.x,1.-uv.y)*vec2(1.,resolution.y/resolution.x);
  vec2 center=vec2(.5,.5*resolution.y/resolution.x);
  p=(p-center)/zoom+center;
  // Large-scale folds stretch the bands into hairline filaments.
  p=swirl(p,vec2(.32,.58),.36*radiusScale,2.8*twist);
  p=swirl(p,vec2(.76,1.08),.48*radiusScale,-3.2*twist);
  p=swirl(p,vec2(.31,1.57),.36*radiusScale,3.5*twist);
  p=swirl(p,vec2(1.12,.39),.42*radiusScale,-1.8*twist);
  p+=vec2(seed*.71,seed*.43);
  vec2 q=vec2(noise(p*1.7+vec2(1.1,4.2)),noise(p*1.7+vec2(8.3,2.8)));
  float flow=dot(p,vec2(cos(direction),sin(direction)))*.8974+(q.x-.5)*distortion;
  flow+=sin(p.y*5.2+q.y*3.3)*bend;
  float phase=flow*density;
  float band=fract(phase);
  float width=(.025+.30*pow(noise(p*2.9+5.),2.))*thickness;
  float edge=.004;
  float broad=1.-smoothstep(width-edge,width+edge,abs(band-.50));
  float fine=(1.-smoothstep(.008*fineWidth,.015*fineWidth+.0001,abs(band-.13)))*step(.001,fineWidth);
  float fine2=(1.-smoothstep(.002*fineWidth,.005*fineWidth+.0001,abs(band-.24)))*step(.001,fineWidth);
  float fine3=(1.-smoothstep(.002*fineWidth,.005*fineWidth+.0001,abs(band-.76)))*step(.001,fineWidth);
  float broken=smoothstep(.37,.57,fbm(p*6.+vec2(3.,8.)));
  float ink=max(broad,max(fine*.85,max(fine2,fine3)*broken));
  float grain=hash(gl_FragCoord.xy);
  float wear=smoothstep(.80,1.,grain)*smoothstep(.42,.7,fbm(p*45.));
  ink*=1.-wear*grainStrength;
  gl_FragColor=vec4(mix(background,paper,ink),1.);
}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
if(gl){const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.uniform2f(gl.getUniformLocation(program,'resolution'),839,1675);gl.viewport(0,0,839,1675);gl.drawArrays(gl.TRIANGLES,0,3);}
const defaults={density:8,thickness:1,fineWidth:1,twist:1,radiusScale:1,distortion:.83,bend:.14,grainStrength:.65,seed:0,zoom:1,direction:.2477,background:'#141618',paper:'#edece7'};
const storageKey='yukomon-marble-static-v1';
let settings={...defaults};
try{const stored=JSON.parse(localStorage.getItem(storageKey));for(const key of Object.keys(defaults)){if(typeof stored?.[key]===typeof defaults[key])settings[key]=stored[key];}}catch{}
const specs=[['density','条带密度',1,30,.25],['thickness','主纹理粗细',.1,3,.05],['fineWidth','细线粗细',0,4,.05],['twist','旋涡强度',-2,3,.05],['radiusScale','旋涡范围',.3,2,.05],['distortion','不规则扭曲',0,2,.01],['bend','条带弯曲',0,.6,.01],['zoom','整体缩放',.4,3,.05],['direction','纹理方向',-3.14,3.14,.01],['grainStrength','颗粒磨损',0,1,.01],['seed','图案偏移',0,20,.1]];
const program=gl?.getParameter(gl.CURRENT_PROGRAM);
const locations=Object.fromEntries(Object.keys(defaults).map(key=>[key,gl?.getUniformLocation(program,key)]));
let motion={speed:0.35,amount:0.35,active:['twist','radiusScale','distortion','bend','direction']};
try{const saved=JSON.parse(localStorage.getItem('yukomon-marble-motion-v1'));if(saved&&Number.isFinite(saved.speed)&&Number.isFinite(saved.amount)&&Array.isArray(saved.active))motion=saved;}catch{}
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let clock=0,last=0,raf=0,lastSaved='';
const amplitudes={density:3,thickness:.6,fineWidth:.6,twist:.42,radiusScale:.18,distortion:.32,bend:.12,zoom:.15,direction:.23,grainStrength:.3,seed:.18};
const liveOutputs={};
function draw(){if(!gl)return;gl.uniform2f(gl.getUniformLocation(program,'resolution'),canvas.width,canvas.height);gl.viewport(0,0,canvas.width,canvas.height);for(const key of Object.keys(defaults)){let value=settings[key];if(rarity&&key==='background')value=rarityPalettes[rarity][0];if(rarity&&key==='paper')value=rarityPalettes[rarity][1];if(typeof value==='number'){
  const index=specs.findIndex(spec=>spec[0]===key),spec=specs[index];
  if(motion.active.includes(key)){
    const phase=clock*(.29+index*.037);
    const shift=(Math.sin(phase+index*1.71)-Math.sin(index*1.71))*.68+(Math.sin(phase*.47+index*.83)-Math.sin(index*.83))*.32;
    value=Math.max(spec[2],Math.min(spec[3],value+shift*amplitudes[key]*motion.amount));
  }
  gl.uniform1f(locations[key],value);
  if(liveOutputs[key])liveOutputs[key].value=value.toFixed(2);
}else gl.uniform3f(locations[key],parseInt(value.slice(1,3),16)/255,parseInt(value.slice(3,5),16)/255,parseInt(value.slice(5,7),16)/255);}gl.drawArrays(gl.TRIANGLES,0,3);const serialized=JSON.stringify(settings);if(serialized!==lastSaved){try{localStorage.setItem(storageKey,serialized);lastSaved=serialized;}catch{}}}
for(const [key,label,min,max,step] of specs){const field=document.createElement('label');field.className='field';field.innerHTML=`<span>${label}<output></output></span><input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}">`;const input=field.querySelector('input'),output=field.querySelector('output');input.value=settings[key];output.value=settings[key];input.oninput=()=>{settings[key]=Number(input.value);output.value=input.value;draw();};field.dataset.key=key;document.querySelector('#fields').append(field);}
document.querySelector('.panel h1').textContent='动态流纹参数';
const motionBox=document.createElement('section');
motionBox.style.cssText='border-bottom:1px solid #54585b;margin-bottom:18px;padding-bottom:14px';
motionBox.innerHTML='<div style="display:flex;gap:8px;margin-bottom:18px"><button id="play" title="暂停动画" aria-label="暂停动画">Ⅱ</button><button id="rewind" title="回到初始状态" aria-label="回到初始状态">↺</button></div>';
document.querySelector('#fields').before(motionBox);
function saveMotion(){try{localStorage.setItem('yukomon-marble-motion-v1',JSON.stringify(motion));}catch{}}
for(const [key,label,min,max,step] of [['speed','变化速度',.05,2,.05],['amount','变化幅度',0,2,.05]]){
 const field=document.createElement('label');field.className='field';field.innerHTML=`<span>${label}<output>${motion[key]}</output></span><input aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}">`;
 const input=field.querySelector('input');input.value=motion[key];input.oninput=()=>{motion[key]=Number(input.value);field.querySelector('output').value=input.value;saveMotion();draw();};motionBox.append(field);
}
for(const field of document.querySelectorAll('#fields .field')){
 const key=field.dataset.key, label=specs.find(spec=>spec[0]===key)[1];
 const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#aaa;margin-top:7px;gap:8px';
 const toggleLabel=document.createElement('label');toggleLabel.style.cssText='display:flex;align-items:center;gap:5px';
 const check=document.createElement('input');check.type='checkbox';check.checked=motion.active.includes(key);check.setAttribute('aria-label',label+'自动变化');
 check.onchange=()=>{motion.active=motion.active.filter(item=>item!==key);if(check.checked)motion.active.push(key);saveMotion();draw();};
 toggleLabel.append(check,document.createTextNode('自动变化'));
 const live=document.createElement('output');live.setAttribute('aria-label',label+'当前值');liveOutputs[key]=live;row.append(toggleLabel,live);field.after(row);row.style.marginBottom='16px';field.style.marginBottom='0';
}
const play=document.querySelector('#play');
function updatePlay(){play.textContent=playing?'Ⅱ':'▷';play.title=play.ariaLabel=playing?'暂停动画':'播放动画';play.setAttribute('aria-pressed',String(playing));}
function tick(now){raf=0;if(!playing||document.hidden){last=0;return;}if(!last)last=now;if(now-last>=1000/30){clock+=Math.min((now-last)/1000,.1)*motion.speed;last=now;draw();}raf=requestAnimationFrame(tick);}
function wake(){if(playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick);}
play.onclick=()=>{playing=!playing;last=0;if(!playing){cancelAnimationFrame(raf);raf=0;}updatePlay();wake();};
document.querySelector('#rewind').onclick=()=>{clock=0;last=0;draw();};
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){cancelAnimationFrame(raf);raf=0;}else wake();});
updatePlay();wake();
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='marble-play')return;playing=Boolean(event.data.playing);last=0;if(!playing){cancelAnimationFrame(raf);raf=0;}updatePlay();wake();});
for(const key of ['background','paper']){const input=document.getElementById(key);const index=key==='background'?0:1;input.value=rarity?rarityPalettes[rarity][index]:settings[key];input.oninput=()=>{if(rarity)rarityPalettes[rarity][index]=input.value;else settings[key]=input.value;draw();};}
document.querySelector('#reset').onclick=()=>{settings={...defaults};for(const field of document.querySelectorAll('.field')){field.querySelector('input').value=settings[field.dataset.key];field.querySelector('output').value=settings[field.dataset.key];}for(const key of ['background','paper'])document.getElementById(key).value=settings[key];draw();};
document.querySelector('#toggle').onclick=()=>{const panel=document.querySelector('#panel');panel.hidden=!panel.hidden;const button=document.querySelector('#toggle');button.textContent=panel.hidden?'☰':'×';button.title=button.ariaLabel=panel.hidden?'展开参数':'收起参数';button.setAttribute('aria-expanded',String(!panel.hidden));};
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='marble-static.png';a.href=canvas.toDataURL('image/png');a.click();};
draw();
</script>
</body>
</html>
